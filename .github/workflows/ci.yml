name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jd_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jd_ledger_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -v

  compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start api and postgres
        run: docker compose up -d --build --wait
      - name: Load demo accounts
        run: docker compose exec -T api python -m jd_ledger.demo
      - name: Try the API
        run: |
          set -e
          curl -fsS http://localhost:8000/accounts/2
          echo
          curl -fsS -X POST http://localhost:8000/transfers \
            -H "Content-Type: application/json" -H "Idempotency-Key: ci-check-1" \
            -d '{"from_account_id": 2, "to_account_id": 3, "amount": 25}'
          echo
          curl -fsS http://localhost:8000/accounts/2/entries?limit=5
          echo
          curl -fsS http://localhost:8000/reconcile | grep '"ok":true'
      - name: Logs
        if: failure()
        run: docker compose logs
